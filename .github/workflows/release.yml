name: Release and Deploy

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. v1.0.7 or 1.0.7)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  test-check:
    name: Verify Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if tests passed on main
        id: check-main-tests
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: context.sha,
              status: 'success'
            });
            const testRun = runs.data.workflow_runs.find(
              run => run.name === 'Build and Test' || run.name.toLowerCase().includes('test')
            );
            if (testRun) {
              core.info(`Found successful test run (${testRun.name}) for commit ${context.sha}. Skipping test re-run.`);
              core.setOutput('skip_tests', 'true');
            } else {
              core.info(`No successful test run found on main for commit ${context.sha}. Tests will be executed.`);
              core.setOutput('skip_tests', 'false');
            }

      - name: Setup pnpm
        if: github.event_name == 'workflow_dispatch' || steps.check-main-tests.outputs.skip_tests != 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        if: github.event_name == 'workflow_dispatch' || steps.check-main-tests.outputs.skip_tests != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch' || steps.check-main-tests.outputs.skip_tests != 'true'
        run: pnpm install --frozen-lockfile

      - name: Run tests
        if: github.event_name == 'workflow_dispatch' || steps.check-main-tests.outputs.skip_tests != 'true'
        run: pnpm run test:ci

  release-and-publish:
    name: Release & Publish to npm
    needs: test-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine Version and Tag
        id: version_step
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_VER="${{ inputs.version }}"
          else
            RAW_VER="${{ github.ref_name }}"
          fi
          CLEAN_VER=$(echo "$RAW_VER" | sed 's/^v//')
          TAG_NAME="v$CLEAN_VER"

          echo "VERSION=$CLEAN_VER" >> $GITHUB_OUTPUT
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
        shell: bash

      - name: Extract Changelog Section
        id: changelog
        run: |
          VERSION="${{ steps.version_step.outputs.VERSION }}"
          awk -v ver="$VERSION" '
            /^## / {
              if (found) exit;
              if ($0 ~ "^## \\[" ver "\\]" || $0 ~ "^## " ver "([ \t]|$)") {
                found = 1;
                next;
              }
            }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md

          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Release $VERSION" > RELEASE_NOTES.md
          fi
        shell: bash

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm run build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_step.outputs.TAG_NAME }}
          name: ${{ steps.version_step.outputs.TAG_NAME }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        run: pnpm publish --access public --no-git-checks --provenance

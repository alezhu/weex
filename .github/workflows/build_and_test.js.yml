# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
      matrix:
        include:

          - node-version: 20.x
            pnpm-version: 10

          - node-version: 22.x
            pnpm-version: 11

          - node-version: 24.x
            pnpm-version: 11

          - node-version: 26.x
            pnpm-version: 11


    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: ${{ matrix.pnpm-version }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'



      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build --if-present

      - name: Test
        run: pnpm run test:ci

      - name: Generate Coverage Badge JSON
        if: ${{ matrix.node-version == '22.x' && github.ref == 'refs/heads/main' }}
        run: |
          node -e "
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync('./coverage/coverage-summary.json'));
            const pct = summary.total.lines.pct;
            let color = 'red';
            if (pct >= 90) color = 'brightgreen';
            else if (pct >= 80) color = 'green';
            else if (pct >= 70) color = 'yellowgreen';
            else if (pct >= 60) color = 'yellow';
            else if (pct >= 50) color = 'orange';
            const badgeData = {
              schemaVersion: 1,
              label: 'coverage',
              message: pct + '%',
              color: color
            };
            fs.mkdirSync('./.github/badges', { recursive: true });
            fs.writeFileSync('./.github/badges/coverage.json', JSON.stringify(badgeData, null, 2));
          "

      - name: Update Coverage Badge in badges branch
        if: ${{ matrix.node-version == '22.x' && github.ref == 'refs/heads/main' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./.github/badges
          publish_branch: badges

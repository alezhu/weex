# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
      matrix:
        include:

          - node-version: 20.x
            pnpm-version: 10

          - node-version: 22.x
            pnpm-version: 11

          - node-version: 24.x
            pnpm-version: 11

          - node-version: 26.x
            pnpm-version: 11


    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: ${{ matrix.pnpm-version }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'



      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build --if-present

      - name: Test
        run: pnpm run test:ci

      # Coveralls keeps the coverage data itself, so no branch/commit is needed:
      # the badge is served by coveralls.io. Upload only from one matrix entry.
      # The repo is created on coveralls.io automatically on the first upload;
      # PR comments additionally require @coveralls as a collaborator.
      - name: Upload coverage to Coveralls
        if: ${{ matrix.node-version == '22.x' }}
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: ./coverage/lcov.info
